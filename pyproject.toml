[project]
name = "gmail-cli"
version = "1.0.0"
description = "Simple text client to read e-mail from you Gmail account"
readme = "README.md"
requires-python = ">=3.14.7"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.3",
    "google-auth-oauthlib>=1.4.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
